name: Backend CI/CD Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/ChatProjesi
            
            # 1. ADIM: KODLARI ZORLA GÜNCELLE
            # Bazen sunucuda 'git pull' hata verir. Bu komutlar GitHub'daki kod neyse
            # sunucudakini acýmadan ona eþitler (çakýþmalarý %100 önler).
            git fetch --all
            git reset --hard origin/main
            
            # 2. ADIM: API'YÝ SIFIRDAN ÝNÞA ET
            # --force-recreate: Docker'ýn eski hafýzayý kullanmasýný kesin olarak yasaklar.
            # DOCKER_BUILDKIT=0 kýsmýný sildik çünkü yeni nesil Compose kullanýyoruz.
            sudo docker-compose up -d --build --force-recreate api