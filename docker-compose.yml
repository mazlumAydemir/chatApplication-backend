version: '3.8'

services:
  # 1. VERİTABANI (SQL Server)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: chatapp_sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd!
    ports:
      - "1434:1433"
    volumes:
      - sql_data:/var/opt/mssql

  # 2. REDIS (Mesajlaşma, şifreleme ve SignalR için şart)
  redis:
    image: redis:latest
    container_name: chatapp_redis
    ports:
      - "6380:6379"

  # 3. BACKEND (C# SignalR API)
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: chatapp_api
    ports:
      - "7220:8080"
    depends_on:
      - db
      - redis

  # 4. FRONTEND (React / Vite)
  client:
    build: 
      context: ./chat-client
      dockerfile: Dockerfile
    container_name: chatapp_client
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  sql_data: